services:
  code-db-ords-deploy:
    secrets:
      - em_db_username_secret
      - em_db_password_secret
      - em_app_username_secret
      - em_app_password_secret
      - em_app_client_id
      - em_app_issuer
      - em_app_audience
      - em_app_jwk_url
      - em_app_support_email
secrets:
  em_db_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_em_db_username_secret
    external: true
  em_db_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_em_db_password_secret
    external: true
  em_app_username_secret:
    name: ${COMPOSE_PROJECT_NAME}_em_app_username_secret
    external: true
  em_app_password_secret:
    name: ${COMPOSE_PROJECT_NAME}_em_app_password_secret
    external: true
  em_app_client_id:
    name: ${COMPOSE_PROJECT_NAME}_em_app_client_id
    external: true
  em_app_issuer:
    name: ${COMPOSE_PROJECT_NAME}_em_app_issuer
    external: true
  em_app_audience:
    name: ${COMPOSE_PROJECT_NAME}_em_app_audience
    external: true
  em_app_jwk_url:
    name: ${COMPOSE_PROJECT_NAME}_em_app_jwk_url
    external: true
  em_app_support_email:
    name: ${COMPOSE_PROJECT_NAME}_em_app_support_email
    external: true
