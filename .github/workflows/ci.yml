name: CI API Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Write Firebase credentials to disk for Google ADC authentication
      - name: Set up Firebase Credentials
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > ~/.config/gcloud/application_default_credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> $GITHUB_ENV

      # Run your existing deployment command using secrets passed into env
      - name: Deploy Container Stack
        env:
          COMPOSE_PROJECT_NAME: "em_ci"
          ORACLE_ADMIN_USER: ${{ secrets.ORACLE_ADMIN_USER }}
          ORACLE_PWD: ${{ secrets.ORACLE_PWD }}
          EM_DB_USER: ${{ secrets.EM_DB_USER }}
          EM_DB_PWD: ${{ secrets.EM_DB_PWD }}
          EM_APP_USER: ${{ secrets.EM_APP_USER }}
          EM_APP_PWD: ${{ secrets.EM_APP_PWD }}
          EM_APP_CLIENT_ID: ${{ secrets.EM_APP_CLIENT_ID }}
          EM_APP_ISSUER: ${{ secrets.EM_APP_ISSUER }}
          EM_APP_AUDIENCE: ${{ secrets.EM_APP_AUDIENCE }}
          EM_APP_JWK_URL: ${{ secrets.EM_APP_JWK_URL }}
          EM_APP_SUPPORT_EMAIL: ${{ secrets.EM_APP_SUPPORT_EMAIL }}
        run: |
          # run the deployment script
          chmod +x ./core/scripts/client_scripts/client_execute_CODE_scripts.sh
          ./core/scripts/client_scripts/client_execute_CODE_scripts.sh deploy dev local yes   

      # Execute pytest once containers are running and ORDS is ready
      - name: Run Pytest Suite
        env:
          DATA_DB_USER: ${{ secrets.EM_DB_USER }}
          DATA_DB_PASSWORD: ${{ secrets.EM_DB_PWD }}
          APP_DB_USER: ${{ secrets.EM_APP_USER }}
          APP_DB_PASSWORD: ${{ secrets.EM_APP_PWD }}
          DB_DSN: ${{ secrets.DB_DSN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMAIL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}  # Firebase Web API Key from Firebase Console
         
        run: |
          pytest -v -s tests/

      # Ensure Swarm stack is cleaned up even if tests fail
      - name: Teardown Swarm
        if: always()
        run: |
          docker stack rm em_ci || true
          sleep 5
          docker swarm leave --force || true